<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Planner | NEET OS</title>

    <link rel="stylesheet"
          href="../assets/css/style.css">

</head>

<body>

<div class="app">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <h2>NEET OS</h2>

            <p>Study Smart</p>

        </div>

        <nav>

            <a href="../index.html">
                🏠 Dashboard
            </a>

            <a href="subjects.html">
                📚 Subjects
            </a>

            <a href="planner.html"
               class="active">
                📝 Planner
            </a>

            <a href="timer.html">
                ⏱ Study Timer
            </a>

            <a href="revision.html">
                🔄 Revision
            </a>

            <a href="analytics.html">
                📊 Analytics
            </a>

            <a href="mocktest.html">
                🧪 Mock Tests
            </a>

            <a href="notes.html">
                📒 Notes
            </a>

            <a href="settings.html">
                ⚙ Settings
            </a>

        </nav>

    </aside>

    <!-- Main -->

    <main class="main">

        <header class="topbar">

            <div>

                <h1>
                    📝 Planner
                </h1>

                <p>
                    Plan your daily study.
                </p>

            </div>

        </header>

        <!-- Planner Form -->

        <section class="panel">

            <h2>
                ➕ Add New Task
            </h2>

            <form id="plannerForm">

                <div class="form-group">

                    <label>
                        Subject
                    </label>

                    <select id="subject">

                        <option value="">
                            Select Subject
                        </option>

                        <option>
                            Biology
                        </option>

                        <option>
                            Chemistry
                        </option>

                        <option>
                            Physics
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>
                        Chapter
                    </label>

                    <input
                        type="text"
                        id="chapter"
                        placeholder="Enter Chapter">

                </div>

                <div class="form-group">

                    <label>
                        Priority
                    </label>

                    <select id="priority">

                        <option>
                            High
                        </option>

                        <option>
                            Medium
                        </option>

                        <option>
                            Low
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>
                        Target Study Hours
                    </label>

                    <input
                        type="number"
                        id="hours">

                </div>

                <div class="form-group">

                    <label>
                        MCQ Target
                    </label>

                    <input
                        type="number"
                        id="mcq">

                </div>

                <div class="form-group">

                    <label>
                        Due Date
                    </label>

                    <input
                        type="date"
                        id="dueDate">

                </div>

                <button
                    type="submit">

                    Save Task

                </button>

            </form>

        </section>

        <!-- Task List -->

        <section class="panel">

            <h2>
                📋 My Tasks
            </h2>

            <div id="taskList">

                No Tasks Added

            </div>

        </section>

    </main>

</div>

<script src="../assets/js/planner.js"></script>

</body>
</html>
