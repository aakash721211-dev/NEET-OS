<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Settings</title>

<link rel="stylesheet"
href="../assets/css/settings.css">

</head>

<body>

<div class="container">

    <h1>
        ⚙ Settings
    </h1>

    <div class="settingCard">

        <h2>
            🔄 Reset NEET OS
        </h2>

        <button id="resetBtn">

            Reset All Data

        </button>

    </div>

    <div class="settingCard">

        <h2>
            📦 Backup

        </h2>

        <button id="exportBtn">

            Export Backup

        </button>

        <br><br>

        <input
            type="file"
            id="importFile"
            accept=".json"
        >

        <br><br>

        <button id="importBtn">

            Import Backup

        </button>

    </div>

</div>

<script src="../assets/js/settings.js"></script>

</body>

</html>
